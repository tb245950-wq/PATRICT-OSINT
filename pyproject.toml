[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "patrict-osint"
version = "2.3.0"
description = "Automated Multi-Domain OSINT & Digital Forensics Framework"
readme = "README.md"
requires-python = ">=3.8"
authors = [{ name = "Muhammad Mughni" }]
dependencies = [
    "phonenumbers>=8.13.0",
    "geopy>=2.4.0",
    "folium>=0.15.0",
    "beautifulsoup4>=4.12.0",
    "dnspython>=2.4.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
    "jinja2>=3.1.0",
    "networkx>=3.2.0",
    "pyvis>=0.3.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pillow>=10.0.0"
]

[project.scripts]
osint = "main:main"
patrict = "main:main"
patrict-osint = "main:main"
